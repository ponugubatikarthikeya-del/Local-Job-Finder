spring.application.name=Local Job Finder
server.port=${SERVER_PORT:8080}

server.address = 0.0.0.0

#By default, Jackson ignores unknown JSON fields during deserialization.
# You can tell Jackson to fail and throw an UnrecognizedPropertyException whenever extra JSON fields are sent.
spring.jackson.deserialization.FAIL_ON_UNKNOWN_PROPERTIES=true

# Datasource (set via environment in production)
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

#WARN ... spring.jpa.open-in-view is enabled by default.
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true

# JWT secret must be provided via environment variable in production
jwt.secret.key=${JWT_SECRET:}

# Mail (use environment variables / secret manager)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

## Add these underneath your spring.mail settings to prevent unexpected server hangs

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# NOTE: Do NOT commit real secrets. Provide env vars in production or use secret manager.

firebase.config.path=${FIRE_BASE_PUSH_NOTIFICATION_PRIVATE_KEY:}

# ==========================================
# OAUTH2 PROVIDER CONFIGURATIONS
# ==========================================

# 1. Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

## 2. GitHub OAuth
#spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:your-github-client-id}
#spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:your-github-client-secret}

## 3. Facebook OAuth (Requires explicit Provider Endpoints)
#spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:your-facebook-app-id}
#spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:your-facebook-app-secret}
#spring.security.oauth2.client.registration.facebook.scope=public_profile,email


#logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n


# for scheduling
# Allows 5 separate background jobs to process concurrently thread-name-prefix: CronJobThread-
spring.task.scheduling.pool.size=5

# -------------------------------------------------------------
# REDIS CORE CONNECTION
# -------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
# Leave password empty if running standard local instance without AUTH
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}

# -------------------------------------------------------------
# LETTUCE CONNECTION POOLING (commons-pool2)
# -------------------------------------------------------------
# Max active connections in the pool at any time
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:16}

# Max idle connections kept alive in pool
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}

# Min idle connections always ready in pool
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:2}

# Max wait time for a connection to become available before throwing exception
spring.data.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:1000ms}

# -------------------------------------------------------------
# SPRING CACHE SETTINGS
# -------------------------------------------------------------
spring.cache.type=redis
# Global default expiration time (e.g., 10 minutes)
spring.cache.redis.time-to-live=600000
# Do not cache null values to prevent empty cache-stampedes
spring.cache.redis.cache-null-values=false
app.redis.cache-monitoring.enabled=${REDIS_CACHE_MONITORING_ENABLED:true}
app.redis.cache-monitoring.interval=${REDIS_CACHE_MONITORING_INTERVAL:5m}
app.redis.cache-monitoring.initial-delay=${REDIS_CACHE_MONITORING_INITIAL_DELAY:1m}


