spring.application.name=Local Job Finder
server.port=${SERVER_PORT:}

server.address = 0.0.0.0

#By default, Jackson ignores unknown JSON fields during deserialization.
# You can tell Jackson to fail and throw an UnrecognizedPropertyException whenever extra JSON fields are sent.
spring.jackson.deserialization.FAIL_ON_UNKNOWN_PROPERTIES=true

# Datasource (set via environment in production)
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true

# JWT secret must be provided via environment variable in production
jwt.secret.key=${JWT_SECRET:}

# Mail (use environment variables / secret manager)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# NOTE: Do NOT commit real secrets. Provide env vars in production or use secret manager.

firebase.config.path=${FIRE_BASE_PUSH_NOTIFICATION_PRIVATE_KEY:}

# ==========================================
# OAUTH2 PROVIDER CONFIGURATIONS
# ==========================================

# 1. Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

