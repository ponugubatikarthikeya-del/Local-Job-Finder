spring.application.name=Local Job Finder
server.port=${SERVER_PORT:}

# Datasource (set via environment in production)
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true

# JWT secret must be provided via environment variable in production
jwt.secret.key=${JWT_SECRET:}

server.address=0.0.0.0

# Mail (use environment variables / secret manager)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# NOTE: Do NOT commit real secrets. Provide env vars in production or use secret manager.

firebase.config.path=${FIRE_BASE_PUSH_NOTIFICATION_PRIVATE_KEY:}

